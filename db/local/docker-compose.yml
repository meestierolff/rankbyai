# Local development stack: plain Postgres + PostgREST (the open-source gateway Neon's Data API is
# compatible with). Tests run here, never against the Neon project.
name: rankbyai-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rankbyai
    ports: ["127.0.0.1:57632:5432"]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - rankbyai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rankbyai"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/rankbyai
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anonymous
      PGRST_DB_CHANNEL_ENABLED: "true"
      # Public keys only (JWKS). Generated by `pnpm db:setup` into db/local/.env
      PGRST_JWT_SECRET: ${LOCAL_JWKS}
      PGRST_JWT_SECRET_IS_BASE64: "false"
      PGRST_SERVER_PORT: 3000
    ports: ["127.0.0.1:57631:3000"]
volumes:
  rankbyai-pgdata:
